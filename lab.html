/* ---------- Antennas and VSWR ---------- */
mod({id:'antennas',group:'rf',title:'Antennas, patterns and VSWR',
idea:'An antenna doesn\'t create power, it shapes where the power goes. And it only radiates well if it is tuned to the band, which the plastic case and circuit board can quietly ruin.',
how:[
'Gain (dBi) is directivity: squeezing energy into some directions at the expense of others. A dipole is omnidirectional around its axis (a doughnut, about 2.15 dBi) with nulls straight up and down. PIFAs (planar inverted-F) sit flat over a ground plane and push energy away from it. PCB trace antennas are cheap and compact but have lumpy, less predictable patterns.',
'An antenna is a resonant structure. Where its impedance matches the 50 Ω feed line, power flows out; elsewhere it reflects back. S11 (return loss), measured with a VNA, shows the dip at resonance. A common design target is S11 below -10 dB across the whole band, roughly VSWR 2:1, which reflects about 11% of power.',
'Putting an antenna in an enclosure shifts its resonance, usually downward, because plastic and nearby metal load it. The ground plane size, cables, shields and even screws all matter. A matching circuit (a few capacitors and inductors, often a pi network) pulls the resonance back.',
'Slide the enclosure shift and watch the dip leave the shaded band. Check how VSWR and lost power change at the band edges.'],
why:[
'Most CPE antenna problems show up as poor range in one orientation, one band much weaker than another, or one chain weaker than the others. Those look like firmware issues in a throughput test but are really RF.',
'Rate versus orientation tests on a turntable, chain-by-chain RSSI, and VSWR checks after the enclosure is final are how they get caught.'],
say:[
'"I\'d evaluate an antenna on pattern, gain and efficiency, and on match: S11 under -10 dB, VSWR under 2:1 across the band, measured in the final enclosure because plastics and ground plane detune it, usually lower in frequency. Fixes are re-tuning the matching network or the ground plane, then confirming with OTA tests like rate versus orientation."'],
build({stage,controls,read}){
  const PAT={
    dipole:{n:'Dipole',g:2.15,az:p=>1,el:p=>{const th=Math.PI/2-p;const s=Math.sin(th);if(Math.abs(s)<1e-3)return 0;return Math.abs(Math.cos(Math.PI/2*Math.cos(th))/s);}},
    pifa:{n:'PIFA',g:3,az:p=>0.55+0.45*Math.cos(p),el:p=>clamp(0.5+0.35*Math.cos(p)+0.15*Math.cos(2*p),0.08,1)},
    pcb:{n:'PCB trace',g:2,az:p=>clamp(0.62+0.22*Math.cos(2*p+0.7)+0.16*Math.cos(p-0.4),0.12,1),el:p=>clamp(0.55+0.3*Math.cos(p)+0.15*Math.sin(3*p),0.08,1)}};
  const BAND={'2.4':{c:2442,lo:2400,hi:2483.5,s0:2200,s1:2700,bw:150,sh:200},'5':{c:5500,lo:5150,hi:5850,s0:4800,s1:6200,bw:1250,sh:500}};
  let type='dipole',plane='el',band='2.4',det=0;
  const S=makeCanvas(stage,w=>w<620?620:340);
  controls.seg('Antenna type',[['dipole','Dipole'],['pifa','PIFA'],['pcb','PCB trace']],type,v=>type=v);
  controls.seg('Pattern view',[['az','From above (azimuth)'],['el','From the side (elevation)']],plane,v=>plane=v);
  controls.seg('Band',[['2.4','2.4 GHz'],['5','5 GHz']],band,v=>band=v);
  controls.slider('Enclosure and ground plane shift',-100,100,1,det,x=>{const b=BAND[band];const f=Math.round(x/100*b.sh);return(f>0?'+':'')+f+' MHz';},x=>det=x);
  read.add('g','Peak gain');read.add('vswr','Worst VSWR in band');read.add('rl','Return loss (worst)');read.add('lost','Power lost to mismatch');
  run(()=>{
    S.fit();const{ctx,W,H}=S;ctx.clearRect(0,0,W,H);
    const stacked=W<620;const half=stacked?{x:0,y:0,w:W,h:300}:{x:0,y:0,w:W*0.42,h:H};const sp=stacked?{x:0,y:310,w:W,h:H-310}:{x:W*0.44,y:0,w:W*0.56,h:H};
    // polar
    const p=PAT[type];const cx=half.x+half.w/2,cy=half.y+half.h/2+8,R=Math.min(half.w,half.h)/2-34;
    [0.25,0.5,0.75,1].forEach(f=>circle(ctx,cx,cy,R*f,null,K.grid,1));line(ctx,cx-R,cy,cx+R,cy,K.grid,1);line(ctx,cx,cy-R,cx,cy+R,K.grid,1);
    const fn=plane==='az'?p.az:p.el;let mx=0;const samp=[];for(let a=0;a<=360;a+=2){const r=fn(a*Math.PI/180);samp.push(r);mx=Math.max(mx,r);}
    ctx.beginPath();samp.forEach((r,i)=>{const a=i*2*Math.PI/180;const x=cx+R*(r/mx)*Math.cos(a),y=cy-R*(r/mx)*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.fillStyle=hexA(K.tx,0.2);ctx.fill();ctx.strokeStyle=K.tx;ctx.lineWidth=2;ctx.stroke();
    text(ctx,p.n+', '+(plane==='az'?'seen from above':'seen from the side'),half.x+12,half.y+18,{size:13,w:600});
    text(ctx,plane==='el'?'up':'',cx,cy-R-8,{align:'center',size:11,color:K.muted});
    text(ctx,plane==='el'?'horizon':'front',cx+R+4,cy-6,{size:11,color:K.muted});
    if(type==='dipole'&&plane==='el')text(ctx,'nulls straight up and down',cx,cy+R+22,{align:'center',size:11,color:K.muted});
    // S11
    const b=BAND[band];const fr=b.c+det/100*b.sh;const gam=f=>Math.sqrt(1-0.97/(1+Math.pow((f-fr)/b.bw,2)));
    const gx=sp.x+44,gy=sp.y+30,gw=sp.w-60,gh=sp.h-70;const X=f=>gx+(f-b.s0)/(b.s1-b.s0)*gw,Y=s=>gy+(-s)/30*gh;
    text(ctx,'S11 (return loss) as a VNA shows it',sp.x+12,sp.y+18,{size:13,w:600});
    ctx.fillStyle=hexA(K.g,0.12);ctx.fillRect(X(b.lo),gy,X(b.hi)-X(b.lo),gh);text(ctx,'Wi-Fi band',(X(b.lo)+X(b.hi))/2,gy+14,{align:'center',size:11,color:K.g,w:600});
    for(let s=0;s>=-30;s-=10){line(ctx,gx,Y(s),gx+gw,Y(s),K.grid,1);text(ctx,s+' dB',gx-4,Y(s)+4,{align:'right',size:10,color:K.muted});}
    line(ctx,gx,Y(-10),gx+gw,Y(-10),K.bad,1.5,[6,4]);text(ctx,'-10 dB target',gx+gw,Y(-10)-4,{align:'right',size:11,color:K.bad});
    ctx.beginPath();for(let i=0;i<=200;i++){const f=b.s0+(b.s1-b.s0)*i/200;const s=20*Math.log10(gam(f));i?ctx.lineTo(X(f),Y(s)):ctx.moveTo(X(f),Y(s));}ctx.strokeStyle=K.rx;ctx.lineWidth=2.4;ctx.stroke();
    for(let i=0;i<=4;i++){const f=b.s0+(b.s1-b.s0)*i/4;text(ctx,Math.round(f)+'',X(f),gy+gh+16,{align:'center',size:10,color:K.muted});}
    text(ctx,'MHz',gx+gw,gy+gh+30,{align:'right',size:10,color:K.muted});
    let worst=0;for(let f=b.lo;f<=b.hi;f+=2)worst=Math.max(worst,gam(f));
    const vswr=(1+worst)/(1-worst),rl=-20*Math.log10(worst),refl=worst*worst*100,ml=-10*Math.log10(1-worst*worst);
    read.set('g',p.g+' dBi');read.set('vswr',vswr.toFixed(2)+' : 1',vswr<2?'good':vswr<3?'warn':'bad');
    read.set('rl',rl.toFixed(1)+' dB',rl>10?'good':rl>6?'warn':'bad');
    read.set('lost',refl.toFixed(0)+'% reflected (-'+ml.toFixed(1)+' dB)',refl<11?'good':refl<25?'warn':'bad');
  });
}});

/* ---------- RF front-end ---------- */
mod({id:'frontend',group:'rf',title:'RF front-end, TSSI and calibration',
idea:'Between the Wi-Fi chip and the antenna sits a small chain of parts that amplify, switch and filter the signal. Calibration data tells the firmware how this particular unit behaves.',
how:[
'Transmit: the baseband creates digital samples, a DAC turns them into an analogue signal, a mixer shifts it up to 2.4, 5 or 6 GHz, and the power amplifier (PA) boosts it. A coupler samples the output for TSSI (transmit signal strength indicator), and the T/R switch connects it to the antenna.',
'Receive runs the other way: antenna, switch, filter, low-noise amplifier (LNA), mixer down, ADC, baseband. The LNA\'s noise figure sets how weak a signal the radio can hear.',
'A FEM (front-end module) packages PA, LNA and switch together. An iFEM is integrated in the Wi-Fi chip; an eFEM is a separate part on the board. External FEMs usually give more power and a better LNA, and need their own control lines driven from the firmware or driver.',
'Every unit is slightly different, so on the production line each one is calibrated: per-chain TX power versus the TSSI reading, frequency offset, and RX gain. These values (caldata) are stored in flash, on Qualcomm platforms as board data. At runtime, the TSSI loop compares the measured output to the target and corrects for temperature drift. The loop is only as good as the calibration it is built on.',
'Try it: heat the unit up with TSSI off and watch power drift. Turn TSSI on and it is held. Then choose bad caldata: the loop holds the wrong value confidently.'],
why:[
'Wrong TX power from bad calibration is invisible in a basic connectivity test but shows up as poor range, failed EVM at high MCS, or a regulatory failure on output power.',
'The brief explicitly mentions Qualcomm logs (caldata, fw_debug) and tuning TX power, TSSI and eFEM control: this is the day-to-day of that job.'],
say:[
'"The TX chain is DAC, mixer, PA, coupler for TSSI, then the switch. RX is switch, filter, LNA, mixer, ADC. The TSSI loop uses a coupled sample of the output to hold target power across temperature, but it relies on per-chain calibration, so bad caldata gives a stable but wrong power. I\'d verify per-chain conducted power and EVM against the power table at temperature extremes."'],
build({stage,controls,read,extra}){
  const S=makeCanvas(stage,w=>w<600?500:470);
  let mode='tx',tgt=20,temp=25,tssi=true,cal='good',sel='pa',t=0;
  const INFO={
    bbT:['Baseband (transmit)','The Wi-Fi chip\'s digital processor builds OFDM symbols: QAM points on each subcarrier, turned into a time-domain waveform. Digital pre-distortion, when used, also happens here.'],
    dac:['DAC','Turns digital samples into an analogue signal. Its resolution and noise limit how clean high-order QAM can be.'],
    mixT:['Up-mixer and LO','Multiplies the signal with a local oscillator to shift it to 2.4, 5 or 6 GHz. LO phase noise and carrier leakage degrade EVM.'],
    pa:['Power amplifier (PA)','Boosts the signal to transmit power. Near saturation it compresses and distorts, so high MCS rates need power backoff. PA bias and gain drift with temperature.'],
    tssi:['Coupler and TSSI','A coupler taps a tiny sample of the output. The TSSI detector turns it into a voltage the firmware reads to measure real output power, closing the power control loop.'],
    sw:['T/R switch','Connects the antenna to either the PA (transmit) or the LNA (receive). Its insertion loss is pure waste in both directions, and its isolation protects the LNA from the PA.'],
    ant:['Antenna','Radiates and receives. Its match (VSWR) and efficiency decide how much of the PA\'s power actually leaves the box.'],
    flt:['Filter','Rejects out-of-band energy, for example keeping strong LTE or 5G signals out of the receiver, and limits transmit harmonics.'],
    lna:['Low-noise amplifier (LNA)','The first gain stage on receive. Its noise figure directly sets sensitivity: 1 dB worse NF is 1 dB less range. An external FEM with a better LNA improves weak-signal reception.'],
    mixR:['Down-mixer and LO','Shifts the received signal back down for sampling.'],
    adc:['ADC','Samples the received analogue signal. Automatic gain control (AGC) keeps it in range so strong and weak signals both decode.'],
    bbR:['Baseband (receive)','Channel estimation, MIMO separation, demodulation and decoding, plus RSSI and SNR reporting you see in driver stats.']};
  const det=el('div',{class:'detail'});extra.append(det);let shown='';
  controls.seg('Signal path',[['tx','Transmit'],['rx','Receive']],mode,v=>{mode=v;});
  controls.slider('Target TX power',10,26,0.5,tgt,x=>x+' dBm',x=>tgt=x);
  controls.slider('Board temperature',-10,75,1,temp,x=>x+' °C',x=>temp=x);
  controls.toggle('TSSI closed loop',tssi,x=>tssi=x);
  controls.seg('Calibration data',[['good','Good caldata'],['bad','Bad caldata (+2.5 dB error)']],cal,v=>cal=v);
  read.add('act','Actual output power');read.add('err','Error vs target');read.add('evm','EVM');read.add('mcs','Highest clean MCS');
  let hits=[];
  S.c.addEventListener('click',e=>{const p=S.pt(e);for(const h of hits){if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){sel=h.id;break;}}});
  S.c.style.cursor='pointer';
  const G0=14,PSAT=28;
  const rapp=pin=>{const al=Math.sqrt(lin(pin+G0)),as=Math.sqrt(lin(PSAT));const ao=al/Math.pow(1+Math.pow(al/as,4),0.25);return 10*Math.log10(ao*ao);};
  run(dt=>{
    t+=dt;S.fit();const{ctx,W,H}=S;ctx.clearRect(0,0,W,H);hits=[];
    const pad=10,cw=(W-2*pad)/7,bw=Math.min(100,cw-10),bh=34,y1=40,y2=118;
    const bx=c=>pad+c*cw+(cw-bw)/2;

    // FEM box
    ctx.setLineDash([5,4]);rrect(ctx,bx(3)-6,y1-14,bx(5)+bw-bx(3)+12,y2+bh-y1+22,8);ctx.strokeStyle=K.v;ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([]);
    text(ctx,'FEM',bx(5)+bw,y2+bh+20,{align:'right',size:11,color:K.v,w:600});
    const blocks=[['bbT','Baseband',0,y1],['dac','DAC',1,y1],['mixT','Mixer ↑',2,y1],['pa','PA',3,y1],['tssi','TSSI',4,y1],
      ['bbR','Baseband',0,y2],['adc','ADC',1,y2],['mixR','Mixer ↓',2,y2],['lna','LNA',3,y2],['flt','Filter',4,y2]];
    const active=mode==='tx'?y1:y2;
    blocks.forEach(([id,lab,c,y])=>{const x=bx(c);rrect(ctx,x,y,bw,bh,6);ctx.fillStyle=sel===id?hexA(K.tx,0.25):(y===active?K.soft:K.bg);ctx.fill();ctx.strokeStyle=sel===id?K.tx:K.line;ctx.lineWidth=sel===id?2:1;ctx.stroke();text(ctx,lab,x+bw/2,y+bh/2+4,{align:'center',size:bw<60?10:12,w:600,color:y===active?K.ink:K.muted});hits.push({id,x,y,w:bw,h:bh});if(c<4)line(ctx,x+bw,y+bh/2,bx(c+1),y+bh/2,y===active?K.ink:K.line,1.2);});
    // switch
    const sx=bx(5),swy=y1,swh=y2+bh-y1;rrect(ctx,sx,swy,bw,swh,6);ctx.fillStyle=sel==='sw'?hexA(K.tx,0.25):K.soft;ctx.fill();ctx.strokeStyle=sel==='sw'?K.tx:K.line;ctx.stroke();text(ctx,'T/R switch',sx+bw/2,swy+swh/2+4,{align:'center',size:bw<60?10:12,w:600});hits.push({id:'sw',x:sx,y:swy,w:bw,h:swh});
    line(ctx,bx(4)+bw,y1+bh/2,sx,y1+bh/2,mode==='tx'?K.ink:K.line,1.2);line(ctx,bx(4)+bw,y2+bh/2,sx,y2+bh/2,mode==='rx'?K.ink:K.line,1.2);
    const ax=bx(6)+bw/2,ay=(y1+y2+bh)/2;line(ctx,sx+bw,ay,ax,ay,K.ink,1.2);line(ctx,ax,ay,ax,ay-26,K.ink,2);line(ctx,ax-10,ay-36,ax,ay-26,K.ink,2);line(ctx,ax+10,ay-36,ax,ay-26,K.ink,2);
    text(ctx,'Antenna',ax,ay+18,{align:'center',size:11,w:600});hits.push({id:'ant',x:ax-24,y:ay-40,w:48,h:66});
    if(sel==='ant'){circle(ctx,ax,ay-26,20,null,K.tx,2);}
    if(tssi&&mode==='tx'){const xa=bx(4)+bw/2,xb=bx(0)+bw/2;ctx.strokeStyle=K.v;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(xa,y1);ctx.lineTo(xa,y1-10);ctx.lineTo(xb,y1-10);ctx.lineTo(xb,y1);ctx.stroke();ctx.setLineDash([]);text(ctx,'feedback loop',(xa+xb)/2,y1-14,{align:'center',size:10,color:K.v});}
    // moving dots
    const path=mode==='tx'?[[bx(0)+bw/2,y1+bh/2],[sx+bw/2,y1+bh/2],[sx+bw/2,ay],[ax,ay]]:[[ax,ay],[sx+bw/2,ay],[sx+bw/2,y2+bh/2],[bx(0)+bw/2,y2+bh/2]];
    for(let k=0;k<4;k++){const[x,y]=along(path,((t*0.35)+k/4)%1);circle(ctx,x,y,4,mode==='tx'?K.tx:K.rx);}
    // PA curve
    const drift=-0.045*(temp-25),off=cal==='bad'?2.5:0;
    const demanded=tgt+off+(tssi?0:drift);const pin=demanded-G0;const out=rapp(pin);const comp=demanded-out;
    const evm=-42+Math.max(0,out-17)*2.2+comp*8;const mE=mcsForEvm(evm);
    const gx=56,gy=y2+bh+52,gw=W-gx-20,gh=H-gy-30;const PX=p=>gx+(p+15)/30*gw,PY=p=>gy+gh-(p)/30*gh;

    line(ctx,PX(-15),PY(-15+G0+0),PX(15),PY(15+G0),hexA(K.muted,0.6),1,[4,4]);

    line(ctx,gx,PY(tgt),gx+gw,PY(tgt),K.rx,1.2,[6,3]);text(ctx,'target '+tgt+' dBm',gx+6,PY(tgt)-4,{size:10,color:K.rx});

   EMBEDDED

mod({id:'stack',group:'emb',title:'Driver, firmware and where the logs come from',
idea:'A Wi-Fi event passes through four layers, from radio hardware up to user-space daemons. Knowing which layer wrote a log line tells you who owns the bug.',
how:[
'<b>Radio hardware</b>: the RF front-end, baseband and MAC hardware on the Wi-Fi chip. Its per-unit calibration (caldata or board data) is loaded at boot.',
'<b>Firmware</b> runs on a processor inside the Wi-Fi chip. On modern offload designs it handles rate control, beamforming sounding, OFDMA scheduling, power save and much of the MAC. Its own debug logs (for example fw_debug on Qualcomm) are often the only view into it.',
'<b>Kernel driver</b> on the router CPU: the vendor driver (Qualcomm, Broadcom or MediaTek specific), plus the Linux wireless stack cfg80211 and nl80211 that user space talks to. Driver messages land in the kernel log (<code>dmesg</code>).',
'<b>User space</b>: hostapd handles authentication, association and WPA keys; wpa_supplicant does the same on the client side; mesh or steering agents and the ISP\'s management agent (TR-069 or TR-369) sit here too. Tools like <code>iw</code> and vendor utilities query the layers below.',
'Pick a scenario and step through. The log lines are illustrative and their exact format varies by vendor, except the TxBF message, which is the real string from the 6 GHz reconnect-loop finding.'],
why:[
'"Client keeps disconnecting" can be a hostapd policy, a driver bug, a firmware crash, or RF. Finding which layer first logged the problem decides whether it goes to the chipset vendor, the CPE firmware team, or the RF team.',
'This is exactly what the CPE log intelligence module automates: broad parsing across all layers, then rules that group events into issues with an evidence timeline.'],
say:[
'"I read logs by layer: hostapd for auth and association decisions, the vendor driver and cfg80211 in dmesg for link and key events, firmware debug logs for rate control, TxBF and scheduling, and calibration data at boot for TX power issues. The first layer to log an anomaly in the timeline is usually the owner."',
'"For example, a 6 GHz client reconnect loop that looked like a roaming problem traced to the driver repeatedly failing to delete a TxBF link for that client, which made it a beamforming defect in the driver and firmware rather than RF coverage."'],
build({stage,controls,read,extra}){
  const S=makeCanvas(stage,w=>w<600?330:300);
  const LAY=[['User space','hostapd, wpa_supplicant, mesh agent, TR-069/369'],['Kernel driver','vendor Wi-Fi driver, cfg80211 / nl80211'],['Wi-Fi firmware','rate control, TxBF, OFDMA scheduler, power save'],['Radio hardware','RF front-end, baseband, caldata']];
  const SC={
    connect:[[3,'[hw] 5G radio: probe request received, rssi -48'],[2,'[fw] mgmt frame forwarded to host: AUTH from aa:bb:cc:11:22:33'],[1,'nl80211: RX mgmt AUTH on wlan1'],[0,'hostapd: wlan1: STA aa:bb:cc:11:22:33 IEEE 802.11: authenticated'],[0,'hostapd: wlan1: STA aa:bb:cc:11:22:33 IEEE 802.11: associated (aid 3)'],[0,'hostapd: wlan1: STA aa:bb:cc:11:22:33 WPA: pairwise key handshake completed (RSN)'],[1,'nl80211: NEW_KEY cipher CCMP installed for aid 3'],[2,'[fw] rate ctrl init: nss 2, bw 80, start mcs 9']],
    txbf:[[2,'[fw] txbf: sounding to aa:bb:cc:44:55:66 (6G) no valid feedback'],[1,'wlc_txbf_delete_link failed',1],[1,'wlc_txbf_delete_link failed',1],[1,'wlc_txbf_delete_link failed (x200+ in capture window)',1],[0,'hostapd: wlan2: STA aa:bb:cc:44:55:66 IEEE 802.11: disassociated'],[0,'hostapd: wlan2: STA aa:bb:cc:44:55:66 IEEE 802.11: associated (aid 7)'],[0,'... repeats: reconnect loop for one client on 6 GHz'],[1,'log intelligence rule: CLIENT_RECONNECT_LOOP + TXBF_LINK_ERROR correlated for this MAC',1]],
    power:[[3,'[boot] board data loaded for radio 1 (caldata from flash)'],[3,'[boot] chain 0/1/2/3 TSSI cal values applied'],[2,'[fw] tpc: target 20.0 dBm, chain 2 measured offset +2.6 dB',1],[1,'driver: regulatory domain GB, max EIRP 23 dBm on 5180'],[2,'[fw] tpc: chain 2 clipped to table limit, evm degraded at mcs 11',1],[0,'test result: MCS 11 PER high at short range on chain 2 only']]};
  let sc='connect',cur=0,playing=false,acc=0;
  const con=el('pre',{class:'console','aria-live':'polite'});extra.append(con);let shown='';
  controls.seg('Scenario',[['connect','Normal client connect'],['txbf','TxBF failure on 6 GHz'],['power','TX power and calibration']],sc,v=>{sc=v;cur=0;});
  controls.button('Previous',()=>{cur=Math.max(0,cur-1);playing=false;},true);
  controls.button('Next event',()=>{cur=Math.min(SC[sc].length-1,cur+1);playing=false;});
  const pb=controls.button('Play',b=>{playing=!playing;if(playing&&cur>=SC[sc].length-1)cur=0;b.textContent=playing?'Pause':'Play';});
  read.add('l','Layer logging now');read.add('own','Likely owner if this is the first anomaly');
  const OWN=['CPE software / hostapd config','CPE driver team or chipset vendor','Chipset vendor (firmware)','RF and hardware team'];
  run((dt,tt)=>{
    const st=SC[sc];cur=Math.min(cur,st.length-1);
    if(playing){acc+=dt;if(acc>1.3){acc=0;if(cur<st.length-1)cur++;else{playing=false;pb.textContent='Play';}}}
    S.fit();const{ctx,W,H}=S;ctx.clearRect(0,0,W,H);
    const lh=(H-20)/4;
    LAY.forEach((l,i)=>{const y=10+i*lh;const on=st[cur][0]===i;rrect(ctx,10,y+4,W-20,lh-8,8);ctx.fillStyle=on?hexA(st[cur][2]?K.bad:K.tx,0.18):K.soft;ctx.fill();ctx.strokeStyle=on?(st[cur][2]?K.bad:K.tx):K.line;ctx.lineWidth=on?2:1;ctx.stroke();
      text(ctx,l[0],24,y+lh/2,{size:16,w:600,cond:true});text(ctx,l[1],24,y+lh/2+18,{size:12,color:K.muted});});
    // trail
    for(let k=0;k<=cur;k++){const x=W-40-(cur-k)*26;if(x<W*0.55)continue;const y=10+st[k][0]*lh+lh/2;circle(ctx,x,y,k===cur?8:5,k===cur?(st[k][2]?K.bad:K.tx):hexA(K.muted,0.6));if(k>0){const x0=W-40-(cur-k+1)*26,y0=10+st[k-1][0]*lh+lh/2;if(x0>=W*0.55)line(ctx,x0,y0,x,y,hexA(K.muted,0.5),1.2);}}
    read.set('l',LAY[st[cur][0]][0]);read.set('own',OWN[st[cur][0]],st[cur][2]?'bad':'');
    const key=sc+cur;if(shown!==key){shown=key;con.innerHTML='';st.slice(0,cur+1).forEach(s=>{const sp=el('span',{class:s[2]?'hl':''},s[1]+'\n');con.append(sp);});con.scrollTop=con.scrollHeight;}
  });
}});

/* ---------- App shell ---------- */
const navgroups=document.getElementById('navgroups'),mobsel=document.getElementById('mobsel');const navBtns={};
Object.entries(GROUPS).forEach(([g,[name,sub]])=>{const sec=el('div',{class:'grp'},el('h2',{},name),el('p',{},sub));const og=el('optgroup',{label:name});
  MODULES.filter(m=>m.group===g).forEach(m=>{const b=el('button',{type:'button',class:'navb'},m.title);b.addEventListener('click',()=>show(m.id));navBtns[m.id]=b;sec.append(b);og.append(el('option',{value:m.id},m.title));});
  navgroups.append(sec);mobsel.append(og);});
mobsel.addEventListener('change',()=>show(mobsel.value));
function fill(id,arr){const h=document.getElementById(id);h.innerHTML='';arr.forEach(p=>h.append(el('p',{html:p})));}
function show(id){
  const m=MODULES.find(x=>x.id===id)||MODULES.find(x=>x.id==='mimo');
  cancelAnimationFrame(raf);
  document.getElementById('areatag').textContent=GROUPS[m.group][0];
  document.getElementById('title').textContent=m.title;document.getElementById('idea').textContent=m.idea;
  const stage=document.getElementById('stage'),c=document.getElementById('controls'),r=document.getElementById('reads'),ex=document.getElementById('extra');
  [stage,c,r,ex].forEach(e=>e.innerHTML='');
  fill('how',m.how);fill('why',m.why);fill('sayt',m.say);
  Object.entries(navBtns).forEach(([k,b])=>b.setAttribute('aria-current',String(k===m.id)));mobsel.value=m.id;
  try{history.replaceState(null,'','#'+m.id);}catch(e){}
  m.build({stage,controls:Controls(c),read:Reads(r),extra:ex});
}
const start=(location.hash||'').slice(1);
show(MODULES.some(m=>m.id===start)?start:'mimo');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(MODULES.some(m=>m.id===h)&&document.getElementById('title').textContent!==MODULES.find(m=>m.id===h).title)show(h);});
})();
</script>
